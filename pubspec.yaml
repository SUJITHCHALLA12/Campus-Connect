name: campus_connect
description: Campus Connect — nearby-first campus messaging over Bluetooth Low Energy.
publish_to: 'none'
version: 0.6.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # BLE: central + peripheral roles (each phone advertises AND scans).
  bluetooth_low_energy: ^6.2.1
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  permission_handler: ^12.0.0
  device_info_plus: ^11.2.0

  # Typography
  google_fonts: ^6.2.1

  # File sharing: pick files, save received files, open them.
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.0.0

  # Voice messages: record, play back, emoji picker.
  # record ^6: the 5.x line is broken against the current
  # record_linux 0.7.x platform package (missing startStream).
  record: ^6.0.0
  audioplayers: ^6.0.0
  emoji_picker_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
