name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Stable release signing: restore the keystore from secrets so
      # NOTE: key.properties MUST live at android/key.properties —
      # build.gradle.kts reads rootProject.file("key.properties"),
      # and rootProject is android/. Writing it to the repo root
      # silently falls back to debug signing (seen 2026-10-15).
      # every build carries the SAME signature. Without this, each CI
      # run signs with a fresh debug key, Android refuses to install
      # the update over the old app, and the user must uninstall —
      # wiping all chats. If the secrets are not set yet, the build
      # falls back to debug signing with a warning (see build.gradle).
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Release keystore restored."
          else
            echo "WARNING: KEYSTORE_BASE64 not set — falling back to debug signing. Updates will NOT install over the old app."
          fi

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/campus-connect.apk

      - name: Publish to Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest APK build
          body: Automated release build of the Campus Connect Android app (release-signed with the stable key, for personal test installs — not for Play Store distribution). Updates install over the old app and keep all chats.
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: "build/app/outputs/flutter-apk/campus-connect.apk"
