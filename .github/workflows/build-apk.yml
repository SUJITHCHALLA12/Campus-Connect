name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/campus-connect.apk

      - name: Publish to Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest APK build
          body: Automated release build of the Campus Connect Android app (debug-signed, for personal test installs — not for Play Store distribution).
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: "build/app/outputs/flutter-apk/campus-connect.apk"
